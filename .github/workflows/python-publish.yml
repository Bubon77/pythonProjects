name: Install and Call Python Script

on: 
  push: 
  workflow_dispatch: 
  

jobs:
  run-first-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run main.py
        env:
          # This maps the GitHub Secret to an Environment Variable
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: python main.py
